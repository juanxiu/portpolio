<text x="450.0" y="526.3" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="18" font-weight="450" fill="#647b8b">일반 조회의 반복 호출은 줄이고, 업데이트에는 직접 조회를 유지했습니다.</text>
