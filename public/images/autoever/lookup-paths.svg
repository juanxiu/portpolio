<text x="552.5" y="286.55" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="17" font-weight="450" fill="#647b8b">변경 사항을</text>
