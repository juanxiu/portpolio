<text x="182.5" y="507.7" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="18" font-weight="450" fill="#647b8b">gRPC는 서비스 간</text>
<text x="182.5" y="532.9" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="18" font-weight="450" fill="#647b8b">논리적 통신 관계입니다.</text>
<text x="600.0" y="761.65" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="19" font-weight="450" fill="#647b8b">서로 다른 EC2에서 두 버전을 실행하며 로드밸런서의 대상 그룹과 라우팅을 전환합니다.</text>
