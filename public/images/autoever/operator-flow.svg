<rect x="335" y="475" width="230" height="95" rx="9" fill="#eef7f5" stroke="#92bdb7" stroke-width="1.5"/>
<text x="450.0" y="515.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="20" font-weight="650" fill="#177b75">배포 상태 판단</text>
<text x="450.0" y="543.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="20" font-weight="450" fill="#177b75">서비스 준비 여부 확인</text>
<rect x="640" y="475" width="220" height="95" rx="9" fill="#ffffff" stroke="#ccd9e1" stroke-width="1.5"/>
<text x="750.0" y="515.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="20" font-weight="650" fill="#183a58">상태 변경 알림</text>
<text x="750.0" y="543.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="20" font-weight="450" fill="#183a58">진행 · 완료 · 실패</text>
<polyline points="450,360 450,475" fill="none" stroke="#177b75" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow1)"/>
<polyline points="565,522 640,522" fill="none" stroke="#177b75" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow1)"/>
<text x="155.0" y="473.7" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="18" font-weight="450" fill="#647b8b">Reconcile은 같은 대상을</text>
<text x="155.0" y="498.9" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="18" font-weight="450" fill="#647b8b">반복해서 처리합니다.</text>
<text x="450.0" y="629.3" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="18" font-weight="450" fill="#647b8b">Deployment 상태 변화와 알림 수신 내역을 대조해 동작을 확인했습니다.</text>
