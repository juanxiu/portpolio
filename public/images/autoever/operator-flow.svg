<text x="150.0" y="159.09999999999997" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="22" font-weight="450" fill="#183a58">배포 설정의 구조</text>
<rect x="40" y="265" width="220" height="95" rx="9" fill="#ffffff" stroke="#ccd9e1" stroke-width="1.5"/>
