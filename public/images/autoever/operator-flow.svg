<polyline points="565,290 640,290" fill="none" stroke="#177b75" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow1)"/>
<text x="602.5" y="262.95" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="17" font-weight="450" fill="#177b75">설정 반영</text>
