<text x="150.0" y="335.6" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="22" font-weight="450" fill="#183a58">선언한 배포 설정</text>
