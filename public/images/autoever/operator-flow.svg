<text x="450.0" y="335.6" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="22" font-weight="450" fill="#177b75">Reconcile</text>
<rect x="640" y="265" width="220" height="95" rx="9" fill="#ffffff" stroke="#ccd9e1" stroke-width="1.5"/>
