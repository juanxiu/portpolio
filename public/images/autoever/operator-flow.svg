<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" role="img" aria-labelledby="title desc">
<title id="title">CR 설정 반영과 배포 상태 감시</title>
<desc id="desc">확인된 구성과 본인 설명을 바탕으로 재구성한 구조도</desc>
<defs>
<marker id="arrow0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#647b8b"/></marker>
<marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#177b75"/></marker>
<marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#183a58"/></marker>
</defs><rect width="100%" height="100%" fill="#fff"/>
<text x="450.0" y="45.75" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="25" font-weight="450" fill="#183a58">모니터링 Operator · 컨트롤러의 역할</text>
